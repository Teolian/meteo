version: '3.8'

services:
  api:
    build: ./backend
    container_name: meteo-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - meteo-data:/app/data
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Moscow}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  meteo-data:
    driver: local
